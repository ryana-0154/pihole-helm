apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pihole.fullname" . }}
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
        # Distinguishes the pihole pod from sidecar deployments that share
        # selectorLabels (e.g. external-dns), so the Services match only this pod.
        app.kubernetes.io/component: pihole
      annotations:
        # Roll the pod when raw dnsmasq snippets change.
        checksum/dnsmasq-extra: {{ toYaml .Values.dnsmasqExtraConfig | sha256sum }}
    spec:
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pihole
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: {{ include "pihole.secretName" . }}
                  key: password
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if and .Values.teleporter.enabled .Values.persistence.enabled }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    marker=/etc/pihole/.teleporter-imported
                    src=/teleporter/{{ .Values.teleporter.secretKey }}
                    [ -f "$marker" ] && exit 0
                    [ -f "$src" ] || exit 0
                    # Wait for FTL to come up, then import. Idempotent via marker.
                    for i in $(seq 1 30); do
                      if pihole-FTL --teleporter import "$src" >/tmp/teleporter-import.log 2>&1; then
                        touch "$marker"
                        exit 0
                      fi
                      sleep 2
                    done
                    echo "teleporter import failed; see /tmp/teleporter-import.log" >&2
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /admin/login
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /admin/login
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: etc-pihole
              mountPath: /etc/pihole
            - name: etc-dnsmasq
              mountPath: /etc/dnsmasq.d
            {{- end }}
            {{- range $name, $_ := .Values.dnsmasqExtraConfig }}
            - name: dnsmasq-extra
              mountPath: /etc/dnsmasq.d/{{ $name }}
              subPath: {{ $name }}
            {{- end }}
            {{- if .Values.teleporter.enabled }}
            - name: teleporter
              mountPath: /teleporter
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: etc-pihole
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-etc
        - name: etc-dnsmasq
          persistentVolumeClaim:
            claimName: {{ include "pihole.fullname" . }}-dnsmasq
        {{- end }}
        {{- if .Values.dnsmasqExtraConfig }}
        - name: dnsmasq-extra
          configMap:
            name: {{ include "pihole.fullname" . }}-dnsmasq-extra
        {{- end }}
        {{- if .Values.teleporter.enabled }}
        - name: teleporter
          secret:
            secretName: {{ .Values.teleporter.existingSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
