{{- if .Values.externalDns.enabled }}
{{- $piholeServer := .Values.externalDns.piholeServer | default (printf "http://%s-web:%v" (include "pihole.fullname" .) .Values.serviceWeb.port) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pihole.fullname" . }}-external-dns
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pihole.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: external-dns
  template:
    metadata:
      labels:
        {{- include "pihole.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: external-dns
    spec:
      serviceAccountName: {{ include "pihole.fullname" . }}-external-dns
      initContainers:
        # Block until Pi-hole's web/API is reachable so the webhook doesn't
        # crashloop trying to authenticate before FTL is up.
        - name: wait-for-pihole
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              url="{{ $piholeServer }}/admin/login"
              echo "waiting for $url ..."
              i=0
              until wget -q -O /dev/null --tries=1 --timeout=3 "$url"; do
                i=$((i+1))
                if [ $i -ge 60 ]; then
                  echo "timed out waiting for pihole" >&2
                  exit 1
                fi
                sleep 5
              done
              echo "pihole reachable"
      containers:
        - name: external-dns
          image: "{{ .Values.externalDns.image.repository }}:{{ .Values.externalDns.image.tag }}"
          imagePullPolicy: {{ .Values.externalDns.image.pullPolicy }}
          args:
            - --provider=webhook
            - --webhook-provider-url=http://localhost:8888
            - --policy={{ .Values.externalDns.policy }}
            - --registry={{ .Values.externalDns.registry }}
            - --txt-owner-id={{ .Values.externalDns.txtOwnerId }}
            - --interval={{ .Values.externalDns.interval }}
            - --log-level={{ .Values.externalDns.logLevel }}
            {{- range .Values.externalDns.sources }}
            - --source={{ . }}
            {{- end }}
            {{- range .Values.externalDns.domainFilters }}
            - --domain-filter={{ . }}
            {{- end }}
            {{- with .Values.externalDns.regexDomainExclusion }}
            # exclusion only takes effect when a positive filter is also
            # set, so pair it with a match-all .*
            - --regex-domain-filter=.*
            - --regex-domain-exclusion={{ . }}
            {{- end }}
          ports:
            - name: http
              containerPort: 7979
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
            successThreshold: 1
          resources:
            {{- toYaml .Values.externalDns.resources | nindent 12 }}
        - name: webhook
          image: "{{ .Values.externalDns.webhook.image.repository }}:{{ .Values.externalDns.webhook.image.tag }}"
          imagePullPolicy: {{ .Values.externalDns.webhook.image.pullPolicy }}
          env:
            - name: SERVER_HOST
              value: "0.0.0.0"
            - name: PIHOLE_SERVER
              value: {{ $piholeServer | quote }}
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pihole.secretName" . }}
                  key: password
            - name: PIHOLE_TLS_INSECURE
              value: {{ .Values.externalDns.piholeTlsInsecure | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.externalDns.logLevel | quote }}
          ports:
            - name: webhook
              containerPort: 8888
          resources:
            {{- toYaml .Values.externalDns.resources | nindent 12 }}
{{- end }}
