{{- if .Values.adlists.enabled }}
{{- $piholeServer := printf "http://%s-web:%v" (include "pihole.fullname" .) .Values.serviceWeb.port -}}
apiVersion: v1
kind: ConfigMap
metadata:
  # Plain resource (not a Helm hook) so Argo doesn't delete it between syncs;
  # the Job below depends on it surviving for post-install/post-upgrade.
  name: {{ include "pihole.fullname" . }}-adlists
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
data:
  desired.json: |
    {{- toJson (dict "block" .Values.adlists.block "allow" .Values.adlists.allow) | nindent 4 }}
  sync.sh: |
    #!/bin/sh
    set -eu
    apk add --no-cache curl jq >/dev/null

    SERVER="{{ $piholeServer }}"
    DESIRED=/config/desired.json
    PRUNE="{{ .Values.adlists.prune }}"
    REBUILD="{{ .Values.adlists.rebuildGravityOnChange }}"

    echo "waiting for $SERVER ..."
    i=0
    until curl -sSf -o /dev/null "$SERVER/admin/login"; do
      i=$((i+1))
      [ $i -ge 60 ] && { echo "timed out waiting for pihole" >&2; exit 1; }
      sleep 5
    done

    echo "authenticating ..."
    SID=""
    i=0
    while [ -z "$SID" ]; do
      resp=$(curl -sS -X POST "$SERVER/api/auth" \
        -H 'content-type: application/json' \
        -d "$(jq -nc --arg p "$PIHOLE_PASSWORD" '{password:$p}')")
      SID=$(echo "$resp" | jq -r '.session.sid // empty')
      [ -n "$SID" ] && break
      err=$(echo "$resp" | jq -r '.error.key // "unknown"')
      i=$((i+1))
      if [ $i -ge 12 ]; then
        echo "auth failed after $i tries: $resp" >&2
        exit 1
      fi
      # Most failures here are transient (api_seats_exceeded as the FTL
      # session pool drains). Back off and retry.
      echo "auth: $err — retrying in 10s ($i/12)" >&2
      sleep 10
    done

    # Always release our session so we don't pin a seat on exit.
    cleanup() { curl -sS -X DELETE -H "X-FTL-SID: $SID" "$SERVER/api/auth" >/dev/null 2>&1 || true; }
    trap cleanup EXIT

    api() { curl -sSf -H "X-FTL-SID: $SID" -H 'content-type: application/json' "$@"; }

    changed=0

    # Reconcile one type ("block" or "allow"). Idempotent.
    reconcile() {
      typ="$1"; key="$2"
      existing=$(api "$SERVER/api/lists?type=$typ" | jq -r '.lists[].address' | sort -u)
      desired=$(jq -r --arg k "$key" '.[$k][].url' "$DESIRED" | sort -u)

      # Add missing.
      for url in $(echo "$desired" | grep -vxF -f <(echo "$existing") || true); do
        [ -z "$url" ] && continue
        comment=$(jq -r --arg k "$key" --arg u "$url" '.[$k][] | select(.url==$u) | .comment // ""' "$DESIRED")
        echo "  + $typ: $url"
        # Pi-hole v6 requires `type` as a query param; body must NOT include it.
        api -X POST "$SERVER/api/lists?type=$typ" \
          -d "$(jq -nc --arg a "$url" --arg c "$comment" '{address:$a, comment:$c}')" \
          >/dev/null
        changed=1
      done

      # Prune extras.
      if [ "$PRUNE" = "true" ]; then
        for url in $(echo "$existing" | grep -vxF -f <(echo "$desired") || true); do
          [ -z "$url" ] && continue
          enc=$(printf '%s' "$url" | jq -sRr @uri)
          echo "  - $typ: $url"
          api -X DELETE "$SERVER/api/lists/$enc?type=$typ" >/dev/null
          changed=1
        done
      fi
    }

    reconcile block block
    reconcile allow allow

    if [ "$changed" = "1" ] && [ "$REBUILD" = "true" ]; then
      echo "rebuilding gravity ..."
      api -X POST "$SERVER/api/action/gravity" >/dev/null || \
        echo "WARN: gravity rebuild request failed (non-fatal)" >&2
    fi

    echo "done."
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pihole.fullname" . }}-adlist-sync
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
spec:
  # Suspended by default — trigger manually via Argo UI ("Create Job from
  # CronJob") or `kubectl create job --from=cronjob/<name> <name>-manual`.
  # Set adlists.schedule to a cron expression and adlists.suspend=false to
  # have it run automatically.
  suspend: {{ .Values.adlists.suspend }}
  schedule: {{ .Values.adlists.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # The script handles its own retries; outer retries just burn API seats.
      backoffLimit: 0
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            {{- include "pihole.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: adlist-sync
        spec:
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: "{{ .Values.adlists.image.repository }}:{{ .Values.adlists.image.tag }}"
              imagePullPolicy: {{ .Values.adlists.image.pullPolicy }}
              command: ["/bin/sh", "/config/sync.sh"]
              env:
                - name: PIHOLE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "pihole.secretName" . }}
                      key: password
              volumeMounts:
                - name: config
                  mountPath: /config
          volumes:
            - name: config
              configMap:
                name: {{ include "pihole.fullname" . }}-adlists
{{- end }}
