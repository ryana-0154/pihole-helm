{{- if .Values.externalDns.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pihole.fullname" . }}-external-dns
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "pihole.fullname" . }}-external-dns
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
rules:
  # Core: external-dns needs to resolve Gateway listeners + service IPs.
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Gateway API.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gateways
      - httproutes
      - grpcroutes
      - tlsroutes
      - tcproutes
      - udproutes
    verbs: ["get", "list", "watch"]
  # Lease for leader election (external-dns >=0.14 uses leases by default).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "pihole.fullname" . }}-external-dns
  labels:
    {{- include "pihole.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "pihole.fullname" . }}-external-dns
subjects:
  - kind: ServiceAccount
    name: {{ include "pihole.fullname" . }}-external-dns
    namespace: {{ .Release.Namespace }}
{{- end }}
