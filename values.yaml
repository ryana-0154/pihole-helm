image:
  repository: pihole/pihole
  tag: "2024.07.0"
  pullPolicy: IfNotPresent

# Admin web UI password. Leave empty to have Pi-hole generate one (check pod logs).
# Recommended: set via --set or a sealed secret.
adminPassword: ""

# Existing secret with key `password` to use instead of `adminPassword`.
existingSecret: ""

timezone: UTC

# Extra env vars passed to the container (FTLCONF_*, PIHOLE_DNS_, etc.)
extraEnv: {}
  # FTLCONF_dns_upstreams: "1.1.1.1;9.9.9.9"
  # PIHOLE_DNS_: "1.1.1.1;1.0.0.1"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  pihole:
    size: 1Gi
  dnsmasq:
    size: 100Mi

# Service for DNS (TCP+UDP 53). Often LoadBalancer with a fixed IP on a home cluster.
serviceDNS:
  type: LoadBalancer
  loadBalancerIP: ""
  annotations: {}
  externalTrafficPolicy: Local
  # Optionally pin to a single IP family / dual stack
  # ipFamilies: [IPv4]
  # ipFamilyPolicy: SingleStack

# Service for the web UI (port 80).
serviceWeb:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pihole.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext: {}
securityContext: {}

# Use hostNetwork (required for Pi-hole DHCP server). When true, DNS service is
# typically unnecessary; clients point directly at the node IP.
hostNetwork: false

# Probes hit the web UI.
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
  readiness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10

replicaCount: 1
