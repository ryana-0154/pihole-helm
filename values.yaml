image:
  repository: pihole/pihole
  tag: "2026.04.1"
  pullPolicy: IfNotPresent

# Admin web UI password. Leave empty to have Pi-hole generate one (check pod logs).
# For real deploys, point existingSecret at a SealedSecret instead.
adminPassword: ""

# Existing secret with key `password` to use instead of `adminPassword`.
existingSecret: "pihole-admin"

# Matches the BST timestamp on the teleporter export.
timezone: Europe/London

# Env vars passed to the container. These mirror the non-default settings from
# the teleporter export (pihole.toml) so a fresh PVC still comes up correctly
# even if the teleporter import is skipped.
extraEnv:
  # Forward to local Unbound (matches upstreams = ["127.0.0.1#5335"]).
  FTLCONF_dns_upstreams: "127.0.0.1#5335"
  # listeningMode = "BIND"
  FTLCONF_dns_listeningMode: "BIND"
  # bogusPriv = true (FTL default, pinned for clarity)
  FTLCONF_dns_bogusPriv: "true"
  # domainNeeded = false (override of FTL default true)
  FTLCONF_dns_domainNeeded: "false"
  # NOTE: dns.hosts are NOT pinned here — external-dns manages local A records
  # from Gateway API resources and would clash with a static seed list.
  # NTP: ipv4 server off, ipv6 server on, sync on (export deltas).
  FTLCONF_ntp_ipv4_active: "false"
  # Larger session pool: external-dns webhook + adlist-sync Job + occasional
  # human use can blow past the default 16 quickly.
  FTLCONF_webserver_api_max_sessions: "64"

# Raw dnsmasq.d snippets from the teleporter (not expressible via FTLCONF_*).
# Rendered into a ConfigMap and subPath-mounted next to Pi-hole's own files.
dnsmasqExtraConfig:
  05-custom.conf: |
    rebind-domain-ok=/ra-home.co.uk/
  99-edns.conf: |
    edns-packet-max=1232

# Declarative adlists. A Helm post-install/upgrade Job reconciles these into
# Pi-hole via the v6 API. Co-exists cleanly with the teleporter import: missing
# entries are added, existing ones are left alone, and (only with `prune: true`)
# entries not declared here are removed.
adlists:
  enabled: true
  # CronJob suspended by default — trigger via Argo UI ("Create Job from
  # CronJob") or `kubectl create job --from=cronjob/<release>-adlist-sync ...`.
  # Set suspend=false + a real schedule to run on a timer.
  suspend: true
  schedule: "0 4 * * *"
  # If true, also delete adlists from Pi-hole that aren't declared here.
  prune: false
  # Trigger a gravity rebuild after the sync if any change was made.
  rebuildGravityOnChange: true
  # Image used for the sync Job (needs sh + apk for curl/jq install).
  image:
    repository: alpine
    tag: "3.19"
    pullPolicy: IfNotPresent
  # Block lists. Each entry: url (required), comment (optional).
  block:
    - url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/pro.txt
      comment: Hagezi Multi PRO - Extended protection
    - url: https://cdn.jsdelivr.net/gh/hagezi/dns-blocklists@latest/adblock/tif.txt
      comment: Hagezi Threat Intel
    - url: https://big.oisd.nl
      comment: OISD Big
  # Allow lists (rare).
  allow: []

# Teleporter restore: a sealed secret holds the .zip; the pod imports it on
# first start (idempotent via a marker file in the PVC).
teleporter:
  enabled: true
  # Name of the (Sealed)Secret in the release namespace.
  existingSecret: pihole-teleporter
  # Key inside that secret holding the zip bytes.
  secretKey: teleporter.zip

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  pihole:
    size: 1Gi
  dnsmasq:
    size: 100Mi

# Service for DNS (TCP+UDP 53). Often LoadBalancer with a fixed IP on a home cluster.
serviceDNS:
  type: LoadBalancer
  loadBalancerIP: ""
  annotations: {}
  externalTrafficPolicy: Local
  # Optionally pin to a single IP family / dual stack
  # ipFamilies: [IPv4]
  # ipFamilyPolicy: SingleStack

# Service for the web UI (port 80).
serviceWeb:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pihole.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext: {}
securityContext: {}

# Use hostNetwork (required for Pi-hole DHCP server). When true, DNS service is
# typically unnecessary; clients point directly at the node IP.
hostNetwork: false

# Probes hit the web UI.
probes:
  liveness:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 30
  readiness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10

replicaCount: 1

# external-dns + Pi-hole webhook sidecar. Watches Gateway API resources and
# syncs their hostnames into Pi-hole's local DNS as A records pointing at the
# parent Gateway's LB IP. Removes the need to hand-maintain FTLCONF_dns_hosts.
externalDns:
  enabled: true
  image:
    repository: registry.k8s.io/external-dns/external-dns
    tag: v0.15.0
    pullPolicy: IfNotPresent
  webhook:
    image:
      repository: ghcr.io/tarantini-io/external-dns-pihole-webhook
      tag: v1.0.0
      pullPolicy: IfNotPresent
  # Gateway API sources to watch. Drop entries you don't use to cut RBAC noise.
  sources:
    - gateway-httproute
    - gateway-grpcroute
    - gateway-tlsroute
    - gateway-tcproute
    - gateway-udproute
  # Restrict to specific zones; empty = manage all hostnames external-dns sees.
  # e.g. ["homelab.lan", "ra-home.co.uk"]
  domainFilters: []
  # sync = create + delete; upsert-only = never delete records.
  policy: sync
  registry: txt
  txtOwnerId: pihole
  interval: 1m
  logLevel: info
  resources: {}
  # Pi-hole API endpoint the webhook talks to. Defaults to the in-cluster web
  # service for this release.
  piholeServer: ""
  # Allow insecure TLS to Pi-hole (the in-cluster web UI is plain HTTP here).
  piholeTlsInsecure: true
